# @package model
# THE STANDARD RNN — the reference architecture from 2026-07-27 onwards.
# A vanilla continuous-time ReLU RNN: dx/dt = -x + W_rec*ReLU(x) + W_inp*u + b, alpha = dt/tau = 0.1.
# Every biologically-motivated or project-specific constraint is OFF:
#   dale: false             -> signed W_rec, no E/I split, every unit reads out
#   io_nonnegativity: false -> W_inp / W_out not clamped non-negative
#   self_connections: true  -> the W_rec diagonal is free and trainable (no zeroed diagonal)
#   gamma: 0                -> no cubic saturation term in the dynamics
#   bias FIXED AT 0          -> not a Parameter at all (a degenerate bias_range)
# Remaining non-vanilla choice, stated deliberately: training noise (sigma_rec/inp/out), standard in
# neuroscience RNNs. Pair with trainer=trainer_ptrack_plain (task_safe_gradients: false) so penalties
# combine with the task loss in the ordinary way.
_target_: trainRNNbrain.rnns.RNN_torch.RNN_torch
RNN_tag: ""
activation_args: {"name": "relu", "slope": 1.0}
equation_type: "h"
N: 100
dt: 1
tau: 10
exc2inhR: 4.0                  # ignored when dale: false
gamma: 0                       # cubic term OFF
dale: false
io_nonnegativity: false
self_connections: true         # standard RNN: units may connect to themselves
weight_boundary: "sticky"      # inert with dale/io_nonnegativity off
weight_boundary_eps: 1.0e-12
connectivity_density_rec: 1.0
spectral_rad: 1.2
sigma_rec: .05
sigma_inp: .05
sigma_out: .03
# NO TRAINABLE BIAS (changed 2026-09-21). A degenerate range makes the bias a fixed zero tensor
# rather than an nn.Parameter, matching rnn_relu_noDale.yaml and every Dale config. It was trainable
# in [-1, 1] for every run up to commit 4f7d73f; those runs are described by their commit hash.
# The bias was never doing anything: fixing it at 0 moved the active-unit count by +5.0 units
# (394/387/404/414/420 -> 413/411/405/423/392, n=5), and it cannot rescue a dead unit anyway -
# a permanently sub-threshold unit has relu'(h) = 0 at every step, so dL/dbias is exactly 0, the
# same absorbing state that traps its weights (measured, not argued). Trained values bore this out:
# |bias|max 0.084 against a box of 1.0. The trainable-bias variant remains available as
# rnn_relu_noDale_trainablebias.yaml.
bias_range: [0.0, 0.0]         # degenerate -> fixed, non-trainable bias = 0
bias_init: "zeros"             # ignored for a degenerate range
input_row_norm: null          # T5 knob: rescale every W_inp row to this norm at init; null = default draw
