# @package model
# Unconstrained RNN WITH a trainable bias — the field-standard architecture, and the reference
# condition for a general-audience result: no Dale's law, no I/O sign constraints, learnable offsets.
#   dale: false             -> signed W_rec, no E/I split, every unit reads out
#   io_nonnegativity: false -> W_inp / W_out not clamped non-negative
#   bias_range: [-1, 1] with bias_init: zeros -> bias starts at 0 (initial weights identical to the
#     bias-free unconstrained net at the same seed) and is clamped to +/-1 after every step.
# Range caveat: +/-1 was chosen from a measurement in DALE nets (silent units sit at x ~ -0.19, min
# -0.296, so b=+0.30 lifts all of them). The scale may differ without Dale; +/-1 is a generous rail
# either way, and the bound is expected not to bind.
_target_: trainRNNbrain.rnns.RNN_torch.RNN_torch
RNN_tag: ""
activation_args: {"name": "relu", "slope": 1.0}
equation_type: "h"
N: 100
dt: 1
tau: 10
exc2inhR: 4.0
gamma: 0   # cubic term off (the established regime); set to 0.1 here to restore it
dale: false
io_nonnegativity: false
weight_boundary: "sticky"      # with dale/io_nonnegativity off there is nothing to clamp; kept for symmetry
weight_boundary_eps: 1.0e-12
connectivity_density_rec: 1.0
spectral_rad: 1.2
sigma_rec: .05
sigma_inp: .05
sigma_out: .03
bias_range: [-1.0, 1.0]        # trainable; clamped to this range after every step
bias_init: "zeros"             # start at 0 so the init matches the bias-free unconstrained net
