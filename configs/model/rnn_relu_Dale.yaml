# @package model
_target_: trainRNNbrain.rnns.RNN_torch.RNN_torch
RNN_tag: ""
activation_args: {"name": "relu", "slope": 1.0}
equation_type: "h"
N: 100
dt: 1
tau: 10
exc2inhR: 4.0
gamma: 0   # cubic term off (the established regime); set to 0.1 here to restore it
dale: true              # W_rec obeys Dale's law (E/I split, sign enforced each step, exc-only readout)
io_nonnegativity: true  # W_inp, W_out clamped >= 0 — a SEPARATE constraint from Dale's law
weight_boundary: "sticky"      # "sticky" (clamp sign-violating weights to +/-eps each step) or "reflective" (|param|*sign)
weight_boundary_eps: 1.0e-12   # boundary value for the "sticky" clamp
self_connections: false          # False zeroes the W_rec diagonal every step; True = standard RNN
connectivity_density_rec: 1.0
spectral_rad: 1.2
sigma_rec: .05
sigma_inp: .05
sigma_out: .03
bias_range: [0.0, 0.0]

