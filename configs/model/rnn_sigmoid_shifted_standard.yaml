# @package model
# THE STANDARD RNN with a BOUNDED, NONLINEAR positive activation: sigmoid(7.5 * (x - 0.3)).
# Identical to rnn_relu_standard in every other respect (no Dale, no I/O positivity, self-connections
# on, gamma 0, trainable bias in [-1, 1]). Exists for one question: is the silent-unit phenomenon a
# property of activations with a linear positive part and a hard/soft floor at zero (ReLU, softplus,
# leaky-ReLU all show it), or does a bounded nonlinear positive part remove it?
# slope 7.5 and shift 0.3 are the values of the earlier rnn_sigmoid_shifted_Dale sweep, so f(0) ~ 0.10:
# a unit at rest is nearly off, as with ReLU, but every unit has gradient everywhere and no unit can
# be exactly zero. Silence must be read with a MODULATION criterion for this model (see docs).
_target_: trainRNNbrain.rnns.RNN_torch.RNN_torch
RNN_tag: ""
activation_args: {"name": "sigmoid", "slope": 7.5, "shift": 0.3}
equation_type: "h"
N: 100
dt: 1
tau: 10
exc2inhR: 4.0                  # ignored when dale: false
gamma: 0                       # cubic term OFF
dale: false
io_nonnegativity: false
self_connections: true
weight_boundary: "sticky"      # inert with dale/io_nonnegativity off
weight_boundary_eps: 1.0e-12
connectivity_density_rec: 1.0
spectral_rad: 1.2
sigma_rec: .05
sigma_inp: .05
sigma_out: .03
bias_range: [-1.0, 1.0]
bias_init: "zeros"
