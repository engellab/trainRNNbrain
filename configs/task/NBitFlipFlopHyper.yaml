# @package task
# N-bit flip-flop with a COMBINATORIAL read-out: same k pulse-train inputs and bit dynamics as
# NBitFlipFlop, but the target is the product of the bit states over EVERY non-empty subset of bits,
# 2^k - 1 output channels (singles, pairs, ..., the k-way parity). The plain task's demand is linear
# in k; this one is exponential, the steelman for "active units track task demand".
taskname: "NBitFlipFlopHyper"
_target_: trainRNNbrain.tasks.Task${.taskname}.Task${.taskname}
# T and mu set the memory demand, and the defaults they replaced (T=100, mu=6) did not impose one:
# the mean inter-pulse interval is n_flip_steps + T/mu, so T=100/mu=6 held a bit for only 1.7 tau.
# At T=300/mu=4 the hold is 7.5 tau with ~2.2 sign changes per channel per trial. T matches CDDM's
# 300 exactly, so per-iteration cost and every timescale comparison carry over unchanged.
T: 300
seed: null
n_inputs: 3
n_outputs: 7      # MUST be 2**n_inputs - 1; the launcher passes both (Hydra cannot compute 2**k)
mu: 4                # expected pulses per trial per bit
n_flip_steps: 10     # pulse width, and the refractory period between pulses on one bit
batch_size: 1024

# The whole trial is scored: unlike CDDM there is no stimulus period to skip and no discontinuous
# target, so the loss floor here is not built the way CDDM's is.
mask_params:
  - (0, ${..T})

task_params: ["n_steps",
              "n_inputs", "n_outputs",
              "mu", "n_flip_steps", "batch_size"]
