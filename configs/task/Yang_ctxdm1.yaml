# @package task
# SINGLE-TASK REFERENCE for the Yang20 multi-task experiment: only contextdm1 (Mante's context-
# dependent decision in ring coding: both modalities show the same two directions with independent
# evidence, respond on modality 1), in exactly the Yang20 input/output layout (all 20 rule channels
# present, one of them ever on), so single- and multi-task networks differ in nothing but the tasks.
# Batch 1000 trials, as Yang20.
taskname: "Yang"
_target_: trainRNNbrain.tasks.TaskYang.TaskYang
T: 300
seed: null
n_inputs: 85
n_outputs: 33
n_eachring: 32
n_per_task: 1000
sigma_tuning: 0.39269908169872414    # pi/8
coherences: [0.04, 0.08, 0.16, 0.32]
grace: 10
rules: [contextdm1]
mask_params:
  - (0, ${..T})
task_params: ["n_steps",
              "n_inputs", "n_outputs",
              "rules", "n_per_task", "n_eachring", "sigma_tuning", "coherences", "grace"]
