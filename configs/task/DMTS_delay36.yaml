# @package task
# DMTS_long with the silent delay lengthened from 16 to 36 tau (T 300 -> 500, everything after the
# sample shifted by 200 steps). Pavel's check (2026-09-15): the frm penalty got networks off the
# no-memory plateau 2-3x earlier at 16 tau; at 36 tau the unpenalised network may not get off it
# at all. Same 4 stimuli, 2 outputs, +-1 tau jitter and scoring as DMTS_long.yaml.
#
# Timing in steps at dt=1, tau=10:
#   sample 20-40 (2 tau)  |  delay 40-400 (36 tau, no input)  |  match 400-420 (2 tau)  |
#   decision cue + target 440-500 (6 tau)
taskname: "DMTS"
_target_: trainRNNbrain.tasks.TaskDMTS.TaskDMTS
T: 500
seed: null
T_stim_on_sample: 20
T_stim_off_sample: 40
T_stim_on_match: 400
T_stim_off_match: 420
T_dec_on: 440
T_dec_off: ${.T}
T_random_window: 10
# Channels follow DMTS_long exactly (redesigned 2026-09-21): ch0/ch1 the two stimulus identities
# as +1 pulses, ch2 a tonic drive held at 1.0 all trial, ch3 the decision cue. Four stimuli made the
# batch 25% match / 75% non-match; two make it 50/50. See DMTS_long.yaml for the full rationale and
# for the warning that the tonic channel is mathematically a bias.
n_inputs: 4
n_stim: 2
tonic: true
num_rep: 256                   # 256 * n_stim^2 = 1024 trials, as in DMTS_long
n_outputs: 2
mask_params:
  - (0, ${..T_dec_on})
  - (450, ${..T_dec_off})
task_params: ["n_steps",
              "n_inputs", "n_outputs", "n_stim", "tonic", "num_rep",
              "stim_on_sample", "stim_off_sample",
              "stim_on_match", "stim_off_match",
              "dec_on", "dec_off",
              "random_window"]
