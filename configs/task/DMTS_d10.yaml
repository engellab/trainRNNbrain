# @package task
# DMTS at a 10-tau delay. Identical to DMTS_long.yaml in every respect except the delay:
# the sample pulse (2 tau), the match pulse (2 tau), the gap before the cue (2 tau) and the
# decision window (6 tau) all keep their lengths, and T shrinks with the delay so that only
# ONE thing varies across the ladder.
# Passive decay over 10 tau is e^-10 = 4.5e-05, far below sigma_rec = 0.05, so the sample cannot
# be carried by a transient at any delay on this ladder - what changes is how slow a mode the
# network has to build, not whether it needs one.
# Delayed match-to-sample with a LONG delay: the third task of the silent-unit line, next to CDDM
# (evidence integration) and the flip-flop (pulse-driven memory bits). What it adds is a memory
# demand that transients cannot meet: the sample is shown for 2 tau, then the inputs are silent for
# 16 tau before the match, so the sample identity must be carried by sustained activity (an
# attractor or slow mode), not by the decay tail of the stimulus response. The default DMTS.yaml
# (T=140, delay 6 tau) is left untouched for the older training runs that use it.
#
# Timing in steps at dt=1, tau=10 (alpha=0.1), T=300 to match CDDM and the flip-flop exactly, so
# per-iteration cost and every timescale comparison carry over:
#   sample 20-40 (2 tau)  |  delay 40-200 (16 tau, no input)  |  match 200-220 (2 tau)  |
#   decision cue + target 240-300 (6 tau)
# Onsets of sample and match are jittered independently by +-1 tau (T_random_window), so the
# network cannot solve the task by counting steps from trial start.
#
# CHANNELS (redesigned 2026-09-21). ch0/ch1 carry the two stimulus identities as +1 pulses, ch2 is
# a tonic drive held at 1.0 all trial, ch3 is the decision cue. The old layout spent one channel per
# identity on FOUR stimuli because inputs used to be constrained non-negative; io_nonnegativity is
# false now, and more importantly 4 stimuli made the batch 4x4 = 16 pairs with only the 4 diagonal
# ones a match -- 25/75, so always answering "non-match" scored 75%. Two stimuli give 2x2 = 4 pairs,
# 50/50 balanced. The memory load drops from 2 bits to 1, which is acceptable: one bit held across
# 16 tau of silence still cannot be carried by a transient, which is what this task is here to test.
# ⚠️ The tonic channel is mathematically a bias (a constant reaching unit i as W_inp[i,2] every
# step). It sets an operating point and cannot carry memory. Since every measure in this project
# counts non-silent units, it is a confound on the main measure; `tonic: false` tests it directly.
# num_rep=256 x 4 pairs = 1024 trials, matching the flip-flop and CDDM batches and the old DMTS runs.
# n_outputs=2 -> one channel for match, one for non-match, like CDDM's two-choice read-out.
taskname: "DMTS"
_target_: trainRNNbrain.tasks.TaskDMTS.TaskDMTS
T: 240
seed: null
T_stim_on_sample: 20
T_stim_off_sample: 40
T_stim_on_match: 140
T_stim_off_match: 160
T_dec_on: 180
T_dec_off: ${.T}
T_random_window: 10
n_inputs: 4
n_stim: 2                      # stimulus identities, on channels 0..n_stim-1
tonic: true                    # channel n_stim held at 1.0 all trial
num_rep: 256                   # 256 * n_stim^2 = 1024 trials, matching flip-flop and CDDM
n_outputs: 2
# Scored: everything before the decision cue (outputs must stay at 0 through sample, delay and
# match) and the decision period after a 1 tau transition, as in DMTS.yaml.
mask_params:
  - (0, ${..T_dec_on})
  - (190, ${..T_dec_off})
task_params: ["n_steps",
              "n_inputs", "n_outputs", "n_stim", "tonic", "num_rep",
              "stim_on_sample", "stim_off_sample",
              "stim_on_match", "stim_off_match",
              "dec_on", "dec_off",
              "random_window"]
