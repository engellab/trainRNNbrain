# @package task
# DMTS at a 5-tau delay. The shortest rung of the ladder, added 2026-10-01 because the 7-tau rung
# is not reliably solvable: of the unpenalised runs scored at that delay, 9 of 28 never escaped
# chance, dropout solved 0 of 9 and duplication 2 of 9, and an unsolved network's active-unit count
# is not comparable with a solved one's. A task arm that fails most of the time cannot carry a
# comparison between interventions, however honestly the solve rate is reported.
#
# Identical to DMTS_d7.yaml in every respect except the delay: the sample pulse (2 tau), the match
# pulse (2 tau), the gap before the cue (2 tau) and the decision window (6 tau) all keep their
# lengths, and T shrinks with the delay so that only ONE thing varies across the ladder.
# Passive decay over 5 tau is e^-5 = 6.7e-03, still well below sigma_rec = 0.05, so the sample
# cannot be carried by a transient here either - what changes is how slow a mode the network has to
# build, not whether it needs one.
#
# Timing in steps at dt=1, tau=10 (alpha=0.1), T=190:
#   sample 20-40 (2 tau)  |  delay 40-90 (5 tau, no input)  |  match 90-110 (2 tau)  |
#   decision cue + target 130-190 (6 tau)
# Onsets of sample and match are jittered independently by +-1 tau (T_random_window), so the
# network cannot solve the task by counting steps from trial start.
#
# CHANNELS as DMTS_d7: ch0/ch1 carry the two stimulus identities as +1 pulses, ch2 is a tonic drive
# held at 1.0 all trial, ch3 is the decision cue.
taskname: "DMTS"
_target_: trainRNNbrain.tasks.TaskDMTS.TaskDMTS
T: 190
seed: null
T_stim_on_sample: 20
T_stim_off_sample: 40
T_stim_on_match: 90
T_stim_off_match: 110
T_dec_on: 130
T_dec_off: ${.T}
T_random_window: 10
n_inputs: 4
n_stim: 2                      # stimulus identities, on channels 0..n_stim-1
tonic: true                    # channel n_stim held at 1.0 all trial
num_rep: 256                   # 256 * n_stim^2 = 1024 trials, matching flip-flop and CDDM
n_outputs: 2
mask_params:
  - (0, ${..T_dec_on})
  - (140, ${..T_dec_off})
task_params: ["n_steps",
              "n_inputs", "n_outputs", "n_stim", "tonic", "num_rep",
              "stim_on_sample", "stim_off_sample",
              "stim_on_match", "stim_off_match",
              "dec_on", "dec_off",
              "random_window"]
