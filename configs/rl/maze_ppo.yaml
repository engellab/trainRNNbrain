# @package _global_
# THE MAZE TASK, trained with PPO (trainRNNbrain/rl/run_maze_ppo.py). One fixed maze; each episode
# drops every agent in a random free cell with a random heading; the RNN steers (turn) and sets the
# speed; the cheese 'C' is the goal. Task definition in trainRNNbrain/rl/maze_env.py. The network is
# the project's standard RNN (model group below), untouched: 2 outputs (turn, speed), inputs =
# env.n_rays (+ 2 with env.goal_cue).
defaults:
  - /model: rnn_relu_standard
  - /paths: paths_local
  - _self_

experiment_tag: "maze_ppo"
seed: 0                       # int, or "random" (the seed used is written back into the saved config)

env:
  # 11 x 11, cheese in the centre, reached only through the inner ring from above or below; the
  # right-hand corridor connects to it only around the outside (geodesic 24 cells from the far side).
  maze:
    - "###########"
    - "#.........#"
    - "#.#####.#.#"
    - "#.#...#.#.#"
    - "#.#.#.#.#.#"
    - "#...#C#...#"
    - "#.#.#.#.#.#"
    - "#.#...#.#.#"
    - "#.#####.#.#"
    - "#.........#"
    - "###########"
  n_rays: 8                   # range sensors over 360 degrees, ray 0 along the heading
  ray_max: 4.0                # cells; corridors are 1 wide, so most rays return within 1-2 cells
  ray_step: 0.1               # cells; ray-marching resolution (40 samples per ray)
  v_max: 0.2                  # cells per decision at full speed (speed = v_max * sigmoid(output)):
                              # 120 decisions for the longest route (24 cells)
  turn_max: 0.3               # radians per decision at full turn (turn = turn_max * tanh(output)):
                              # a U-turn in ~10 decisions
  goal_radius: 0.5            # cells from the cheese centre that ends the episode
  goal_cue: false             # true adds cos/sin of the bearing to the cheese (the "cue" arm)
  reward:
    goal: 5.0                 # once, on reaching the cheese
    step: -0.01               # every decision: be quick
    wall: -0.02               # every blocked move (small, so bumps while exploring do not dominate)
    shape: 0.2                # per cell of geodesic progress, undiscounted: standing still earns 0
                              # (the discounted form paid a stationary agent and the first runs,
                              # array 16790695, converged to standing still)

ppo:
  n_episodes: 256             # parallel episodes per update (the batch)
  T: 300                      # decisions per episode (RNN steps = T * substeps)
  # ONE DECISION PER `substeps` RNN STEPS. The standard RNN has alpha = dt/tau = 0.1, so it reacts
  # about 10 steps late. With one decision per RNN step (the first runs, array 16790695) the agent
  # moved 2 cells before seeing a wall, and slowing to a stop was the safe policy: probe success
  # 0.02 at N = 100 after 150 updates, against 0.30 for a network with alpha = 0.5 (local check,
  # 3 Nov 2026). Slowing the agent 5x at one decision per step did not help either (0.09): the
  # per-step action noise then averages out over a cell. So the network is unchanged and gets
  # `substeps` of its own steps per decision, with the observation held; the action is read from
  # the state after the last of them. Training cost scales with substeps.
  substeps: 5
  n_updates: 1000
  gamma: 0.99
  gae_lambda: 0.95
  clip: 0.2
  n_epochs: 4                 # passes over the rollout per update
  n_minibatches: 2            # episodes split per epoch; each minibatch is one full BPTT pass
  value_coef: 0.5
  entropy_coef: 0.0           # log_std is learned through the policy gradient alone
  log_std_init: -0.7          # std 0.5 in raw output units (squashed by tanh / sigmoid in the env)
  log_std_min: -2.3           # floor, std 0.1: exploration cannot vanish (it fell to std 0.03 in
                              # the first runs)
  lr: 0.001                   # scaled by (100 / N) ** lr_scale_exp, the supervised trainer's rule
  lr_scale_exp: 0.3333333333333333
  weight_decay: 1.0e-6        # Adam's coupled L2, as in the supervised trainer
  max_grad_norm: 0.5
  probe_every: 10             # updates between clean probes (noise-free, mean action, fixed drops)
  probe_episodes: 128
  probe_seed: 20261103        # the probe's drops: the same starts at every probe of every run
  store_participation_every: 5   # probes between stored full participation vectors
  checkpoint_every: 100       # updates between writes of the run folder
