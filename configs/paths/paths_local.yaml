# @package paths
save_to: "/Users/pt1290/Documents/GitHub/trainRNNbrain/data/trained_RNNs"

# Warm start: folder of a finished run whose *LastParams*.npz initialises this one. null = fresh
# init (the normal case). The PENALTY IS NOT INHERITED - lambda_frm/lambda_rws come from this run's
# trainer config, which is what makes a penalty-switch experiment possible.
init_from: null
# Restore the source run's Adam moments too. OFF by default: carrying momentum shaped by the old
# objective across a penalty SWITCH imports the old search direction and confounds the very effect
# being measured. Turn on only when continuing under the SAME penalty.
init_adam: false

# Where periodic checkpoints go. null puts them in "<save_to>_checkpoints".
# ⚠️ NEVER POINT THIS INSIDE save_to. Cells are inventoried by globbing for subfolders that hold
# *LastParams*, so a checkpoint folder sitting among the real runs would be counted as a finished
# run -- inflating every count and shifting which parent a top-up task continues.
checkpoint_to: null
