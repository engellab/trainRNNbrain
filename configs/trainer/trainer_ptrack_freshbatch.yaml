# @package trainer
# trainer_ptrack_plain.yaml with same_batch OFF, for tasks whose trials are drawn from a continuous
# distribution rather than an enumerable condition grid.
#
# WHY THIS EXISTS. same_batch=True draws ONE batch and reuses it for every iteration. On CDDM that is
# defensible: get_batch() returns all 450 conditions, so "the batch" IS the task and repeating it is
# repeating the full condition set. On the n-bit flip-flop it is not: pulse times are drawn i.i.d.
# from an exponential inter-event distribution, so a fixed batch is 256 samples of a continuous
# space. Training a 2000-unit network on 256 frozen trials for a million iterations measures
# memorisation, not the task, and the "loss floor" it converges to is a memorisation floor with no
# bearing on task difficulty.
#
# The cost is a fresh batch every iteration. TaskNBitFlipFlop.generate_input_target_stream was
# vectorised for this (the per-timestep membership scan it used was ~40% of a GPU step at k=8).
_target_: trainRNNbrain.trainer.Trainer.Trainer
trainer_tag: "BaseTrainer"
max_iter: 3000
anneal_noise: False
lr: 0.001
weight_decay: 1e-6
max_grad_norm: 50.0
# Gradient-spike defences. An update whose gradient norm exceeds spike_factor x a rolling MEDIAN is
# DROPPED, not clipped (Adam is scale-invariant, so clipping barely limits a spike's effect).
# After restore_after consecutive skips the weights are rolled back to the last snapshot, because
# a skip freezes the weights and nothing else can move them out of an overflowing region.
spike_factor: 1.0e6      # only genuine catastrophes (~1e30x normal); 100 fired on 6-18% of
                         # ordinary gradients once their distribution went heavy-tailed
gnorm_window: 1000       # rolling median over EVERY step, accepted or skipped - cannot go stale
gnorm_min_samples: 100
snapshot_every: 1000
restore_after: 500
lr_scale_exp: 0.3333333333333333
same_batch: False
monitor: False              # no per-penalty loss/gradient monitoring: saves a backward pass per active term
task_safe_gradients: False  # plain descent on task + sum(lambda_k * penalty_k) — no projection
                            # False = plain descent on task + sum(lambda_k * penalty_k)
track_participation: True   # log per-unit participation during training (participation-trace experiment)
track_every: 10             # iterations between probes (a noise-free forward pass, ~3 pct overhead)
log_silent_every: null           # print silent counts (three criteria) to stdout every this many iterations;
                                 # null = never. The trace is written only on completion, so this is the
                                 # only way to watch silencing during a run.
store_participation_every: 100   # how often the FULL per-unit participation vector is stored; the
                                 # scalar metrics are recorded at every probe. Only bulky item.
track_valid: False           # evaluate the noise-free probe on a HELD-OUT batch too (coherences
                            # interleaved with the training grid). Costs one extra forward pass per
                            # probe; the training-batch clean loss is free either way.
track_valid_every: 50        # iterations between held-out evaluations (its own cadence:
                            # the held-out batch is ~as large as the training one, so probing it
                            # every track_every would cost ~18% of runtime for no added resolution)
track_drift: False              # weight drift + directional persistence (W_inp, W_rec, W_out).
                                 # Nothing about the weights is written to disk: reference snapshots
                                 # live in CPU RAM and everything is reduced to scalars on the fly.
drift_lags: [100, 1000, 10000]   # lags for ||W(t)-W(t-L)||/||W(t)|| and ||dp||/||p||. Several are
                                 # needed: diffusion grows as sqrt(L), systematic drift as L.
# Penalties available in Trainer but INACTIVE here (all default to 0.0 in the Trainer signature,
# so omitting them keeps them off): lambda_iwm / rwm / owm (input, recurrent, output weight-magnitude
# caps), lambda_hm (hidden-state magnitude), lambda_tv (across-trial output variability), lambda_fri
# and lambda_hi (Gini/HHI inequality of rates or hidden drive), lambda_htvar (temporal variance of
# hidden drive), lambda_cl (clustering), lambda_effdim (eigenvalue tail energy). Add the lambda and
# its *_args block back here to enable one. NOTE lambda_orth is kept explicitly below because its
# Trainer default is 0.3, NOT 0 — dropping it from this file would silently switch it on.
lambda_orth: 0.0
orth_args:
  orth_input_only: True
lambda_met: 0
met_args: {}
lambda_rws: 0.05 # sparsity
rws_args:
  tg_deg: 20
  eps: 1e-12
lambda_frm: 0.2 # magnitude of firing rates
frm_args:
  cap_fr: 0.3
  tau: 0.1
  g_top: 3.0
  g_bot: 3.0
  alpha: 1.0
  beta: 1.0
  eps: 1e-12
  aggregation: mean   # neuron-level pooling of per-unit FR-deviation penalty: 'mean' or 'logsumexp'
  tau_n: 1.0          # logsumexp temperature: small -> max (fights worst outlier); large -> mean. Ignored if aggregation=mean
dropout: False
dropout_args:
  dropout_kind: "mute"
  sampling_method: "participation"
  eta: 0.5
  active_rel: 0.05     # a unit joins the drop pool if participation >= this * q95(participation)
  drop_rate: 0.05      # fraction OF THE LIVE POOL dropped each iteration
  rescale: true        # scale kept units by 1/(1-p_i) so the dropout pass matches the full network
  p_max: 0.9           # ceiling on any unit's drop probability; also caps the factor at 1/(1-p_max)
  dropout_beta: 1.0
  activity_q: 0.9

# --- prune-and-reinitialise: recycle units that stay silent ---
# A silent ReLU unit has exactly zero gradient on every incoming and outgoing weight, so no penalty
# can revive it. This redraws its INCOMING weights from the initialisation distribution once it has
# been silent for `patience` consecutive checks. Off by default.
prune_reinit: False
prune_args:
  check_every: 100    # iterations between silence checks
  patience: 3         # consecutive silent checks before a unit is redrawn (3 x 100 = 300 iters)
  active_rel: 0.05    # silent if participation < this * q95(participation); the project-wide criterion
  reinit_mode: random # 'random' redraws incoming weights and LEAVES the outgoing ones as
                      # training left them; 'zero_out' redraws incoming and ZEROES outgoing
                      # (Dohare et al.'s rule, so a new unit cannot disturb anything);
                      # 'orth' draws a row orthogonal to every live unit's, so the new unit
                      # reads an input combination nobody reads; 'mix' blends several live
                      # units, a twin of nobody; 'bias_kick' writes a bias offset and
                      # touches no weight at all; 'copy'
                      # duplicates a live unit (Net2Net) and splits that unit's OUTGOING weights
                      # between it and the copy, so the network computes the same function at the
                      # instant of duplication. A random unit has no function, so the task gradient
                      # has no reason to keep it -- measured on 2026-09-22, 26,012 random redraws
                      # over 591 units died 44 times each with the active count unmoved.
  mix_k: 4            # 'mix' blends this many live units with uniformly random weights
  copy_noise: 0.05    # relative jitter on the copy's incoming weights. Without it the twins take
                      # identical drive and identical gradients and never separate.
  # --- features from Dohare et al., Nature 632:768-774 (2024), "Loss of plasticity in deep
  # continual learning". Their algorithm replaces low-utility units during training; these four
  # knobs bring our rule into line with theirs so the two can be compared directly.
  utility: participation  # 'participation' = std(r)+q90(r), how loudly a unit fires. 'contribution'
                          # = running mean of |r| * sum|outgoing weight|, how much its firing
                          # actually reaches the network. A unit driving weights that go nowhere
                          # scores healthy on the first and useless on the second.
  utility_decay: 0.99     # running-average rate for the contribution utility (their value)
  maturity: 0             # iterations of UNCONDITIONAL protection after a unit is replaced. The
                          # strike counter only protects a unit that starts firing, so a quiet
                          # replacement is replaced again: at N=500 that gave 54.6 replacements per
                          # unit with the active count unmoved. 0 = off (all runs before 2026-09-23).
  max_replace_frac: 1.0   # ceiling on the fraction of units replaced per check. When more units
                          # qualify, the LOWEST-utility ones go first. 1.0 = uncapped, which is
                          # what every run before 2026-09-23 used: 4.7e-4 of units per step on
                          # CDDM at N=1000 (stable) and 1.4e-3 on the flip-flop at N=500 (29-44%
                          # of gradient updates discarded). Dohare et al. use ~1e-5 per step.

# --- homeostatic synaptic scaling: excitation up, inhibition down ---
# Multiplicative scaling of INCOMING weights toward a participation set-point. Excitatory and
# inhibitory synapses scale in OPPOSITE directions: scaling a silent unit's whole row up would make
# a negative net drive more negative and bury it deeper. Relative weights are preserved within the
# excitatory set and within the inhibitory set separately. Off by default.
synaptic_scaling: False
scaling_args:
  every: 100        # iterations between scaling events
  eta: 0.05         # step size; alpha is clipped to [1/(1+eta), 1+eta]
  scale_q: 0.5      # set-point = this quantile of participation over the LIVE pool (scale-free)
  preserve_row_norm: true  # after the excitation-up / inhibition-down step, rescale each unit's
                         # input row back to the norm it had, making the event a pure
                         # REDISTRIBUTION between excitation and inhibition at fixed total synaptic
                         # weight. Required, not optional: the sign split changes a row's magnitude
                         # by about (alpha + 1/alpha), which exceeds 2 for every alpha but 1, so
                         # every event pumps magnitude in whichever way it scales. Without this,
                         # all three seeds of both target modes blew up (19-55% of gradient updates
                         # discarded, final r2 NaN or -inf).
  scale_target: median   # 'median' = single set-point (homogenises); 'lognormal' = RANK-MATCHED,
                         # each unit pulled toward the value a lognormal population would give a
                         # unit of its rank. Preserves spread; cannot homogenise.
  sigma_log: 1.2         # sigma of the target lognormal in natural log. Only used by 'lognormal'.
                         # 1.2 is what the networks' OWN weight distributions show (sigma_log10
                         # 0.50-0.56 per input channel) and matches cortical EPSP spread (~2 decades).
