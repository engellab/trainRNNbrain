# @package trainer
# PPO FOR THE MAZE (trainRNNbrain/trainer/TrainerPPO.py), the trainer of configs/task/Maze.yaml. The RNN
# is the whole agent, run one step at a time through its own right-hand side; the trainer plays
# episodes, computes advantages and applies the clipped PPO update, probes participation on fixed
# drops, and asks the run script to write a checkpoint through the same checkpoint_fn hook the
# supervised Trainer has. Until 5 Nov 2026 this block was `ppo:` in configs/rl/maze_ppo.yaml; every
# value is as it was. lr, lr_scale_exp and weight_decay are read by run_rl.py, which builds the Adam
# optimizer with the supervised size rule (as run_experiment.py does for the supervised Trainer).
_target_: trainRNNbrain.trainer.TrainerPPO.TrainerPPO
trainer_tag: ""             # empty, so a run lands in <save_to>/Maze_<experiment_tag>/, the maze
                            # suite's cell names (Maze_suite/N=<N>_act=<act>/)
n_episodes: 256             # parallel episodes per update (the batch)
T: 500                      # decisions per episode (RNN steps = T * substeps): 3.4x the longest
                            # route at full speed
# ONE DECISION PER `substeps` RNN STEPS. The standard RNN has alpha = dt/tau = 0.1, so it reacts
# about 10 steps late. With one decision per RNN step (the first runs, array 16790695) the agent
# moved 2 cells before seeing a wall, and slowing to a stop was the safe policy: probe success
# 0.02 at N = 100 after 150 updates, against 0.30 for a network with alpha = 0.5 (local check,
# 3 Nov 2026). Slowing the agent 5x at one decision per step did not help either (0.09): the
# per-step action noise then averages out over a cell. So the network is unchanged and gets
# `substeps` of its own steps per decision, with the observation held; the action is read from
# the state after the last of them. Training cost scales with substeps.
substeps: 5
n_updates: 2000             # the task is learned within ~500; the rest measures the decline after
# THE UPDATE CLOCK of a continuation (paths.init_from): the absolute update at which this run's count
# starts, added to every update index in Progress.json and Participation.npz, so the continuation's
# records start where the parent's end and common.maze_load_runs reads the chain as one run. `auto`
# = the parent's last recorded update when paths.init_from is set, else 0. Resolved in run_rl.py and
# written back, so the saved config records the window this run covers (as the supervised trainer
# configs' iter_offset is).
iter_offset: auto
gamma: 0.99
gae_lambda: 0.95
clip: 0.2
n_epochs: 4                 # passes over the rollout per update
n_minibatches: 2            # episodes split per epoch; each minibatch is one full BPTT pass
value_coef: 0.5
entropy_coef: 0.0           # inert: with a fixed action_std the entropy is a constant
# THE RNN IS THE WHOLE AGENT (Pavel, 4 Nov 2026): no value network, no learned exploration
# parameters. With critic: true the RNN has a third read-out row, the value, trained by the value
# loss through the same W_out and recurrent weights, and advantages come from GAE; with
# critic: false the RNN has 2 read-out rows and advantages are Monte-Carlo returns minus their
# batch mean at each step (no parameters). The exploration noise is a fixed std in raw output
# units (a learned log-std collapsed to -3.4 in the first runs). critic: false since the
# comparison of 4 Nov 2026 (issue #3): on the old maze at N = 100, 300 updates, probe success
# 0.52 and 0.77 without a critic against 0.69 and 0.41 with one; the one-epoch unclipped
# variants (A2C-like, REINFORCE) diverged.
critic: false
action_std: 0.5
lr: 0.001                   # scaled by (100 / N) ** lr_scale_exp, the supervised trainer's rule
# LEARNING-RATE WARM-UP (since 4 Nov 2026): the rate ramps linearly from 0 to its value over the
# first warmup_updates updates. Adam's first steps move every parameter by about lr before its
# moment estimates exist, so the read-out's first change scales with lr x N: in the suite the
# first update's KL grew from 0.04 at N = 250 to 0.15 at N = 1,000 and 0.24 at N = 2,000 (every
# later update 0.003 at every size), and at N = 2,000 the recurrent dynamics blew up over the
# 2,500-step episode (arrays 16856487, 16859389). The ramp removes that jump at every size
# without changing the rate rule, so one protocol serves N = 250 to 4,000. 0 switches it off.
# A CONTINUATION that restores its parent's Adam moments (paths.init_from with paths.init_adam:
# true) does not ramp again: the jump the ramp removes comes from Adam's first steps before its
# moment estimates exist, and a restored state has them, so a second ramp would only slow the
# continuation's first warmup_updates updates. A continuation without the moments (paths.init_adam:
# false, or a parent written before the AdamState file existed) starts Adam afresh and ramps again.
warmup_updates: 50
lr_scale_exp: 0.3333333333333333
weight_decay: 1.0e-6        # Adam's coupled L2, as in the supervised trainer
# THE OPTIMISER (issue #6, since 5 Nov 2026), the switch of run_experiment.py mirrored in
# run_rl.build_optimizer, the B5 optimiser comparison's keys (configs/experiment/b5_optimizer_ff.yaml,
# slurm/SilentReLU_b5_optimizer_spock.slurm): adam applies weight_decay as coupled L2 (wd x w added to
# the gradient, then divided by sqrt(v), so a unit with no task gradient is pulled to zero at about
# lr per step whatever wd is); adamw decouples it (w -= lr x wd x w); sgd adds the same wd x w to the
# gradient with no normalisation. The size rule, the warm-up ramp and the AdamState file (which keeps
# its name whichever optimiser wrote it) apply to all three; a continuation that restores the state
# (paths.init_adam) must name its parent's optimiser. Runs saved without this key ran adam.
optimizer: adam             # adam (coupled L2) | adamw (decoupled) | sgd
momentum: 0.0               # sgd only
max_grad_norm: 0.5
probe_every: 10             # updates between clean probes (noise-free, mean action, fixed drops)
probe_episodes: 128
probe_seed: 20261103        # the probe's drops: the same starts at every probe of every run
store_participation_every: 5   # probes between stored full participation vectors
checkpoint_every: 100       # updates between writes of the run folder (run_rl.py's checkpoint_fn)
# KEPT SNAPSHOTS (since 7 Nov 2026). Each checkpoint overwrites the run folder, so by default the weights
# exist only at the end of a run. true also writes the config and the parameter file at every
# checkpoint and at the end into <paths.checkpoint_to, or <save_to>_checkpoints>/<Maze_tag>/s<seed>/u<update>/
# (run_rl.py, save_snapshot), outside the tree the readers glob, so a network can be read at its
# learned point. About 4 MB per snapshot at N = 1,000. A launcher turns it on with KEEP_ALL=true.
checkpoint_keep: false
# AFTER AN EPISODE ENDS (since 8 Nov 2026). false: the RNN keeps stepping on the last observation after the
# cheese, in the rollout and in the recompute, and the rate and metabolic penalties average over those steps
# too: every run before 8 Nov 2026 ran this way, and a run saved without the key did. Nothing in the task
# constrains those post-episode dynamics, and they can grow without bound: in met0.01 seed 1 they reached
# |x| ~ 1e21 while every running episode stayed below 2, the metabolic penalty overflowed and every optimiser
# step from update 1,501 on was skipped; rwm0.2 seed 1 was stopped by the rollback guard the same way
# (docs/project_trajectory/2026-11-08_*_round19-met0.01-frozen-cause.md). true: an ended episode's state is
# held at its value at the end, and the two penalties average over the steps before the end only
# (TrainerPPO.freeze_after_end). Kept false here so that a continuation of an existing chain trains as its
# parent did; a run that should use the fix sets it on the command line, and switching the default is the
# coordinator's decision (the existing Maze results ran with false).
freeze_after_end: false
# --- THE PAPER'S INTERVENTIONS (issue #5, the five of Figure 5 minus rescaling), each OFF here; an
# arm sets its key on the launcher command line (slurm/rl_maze_interventions_spock.slurm). Every
# definition is the supervised Trainer's, mirrored in TrainerPPO (its docstrings quote the
# supervised lines); the keys and the *_args blocks are those of trainer_ptrack_freshbatch.yaml.
lambda_frm: 0               # RATE PENALTY (TrainerPPO.fr_magnitude_penalty) on the recompute's
                            # states of every minibatch: loss += lambda_frm x P. Paper values 0.1
                            # (3-bit flip-flop) and 0.2 (CDDM); the maze grid runs 0.03, 0.1 and
                            # 0.3, because the PPO loss is on another scale than the squared error
frm_args:                   # the paper's values (the frm_args block of trainer_ptrack_freshbatch.yaml)
  cap_fr: 0.3               # the cap on a unit's soft-max rate is cap_fr x log1p(100) / log1p(N)
  tau: 0.1                  # temperature of the soft-max over every step and episode
  g_top: 3.0                # exponent of ((a - cap) / cap) above the cap
  g_bot: 3.0                # exponent of ((cap - a) / cap) below the cap
  eps: 1e-12
lambda_rws: 0               # SPARSITY PENALTY on W_rec (TrainerPPO.rec_weights_sparsity_penalty):
                            # loss += lambda_rws x P. Paper value 0.05, together with lambda_frm 0.1
rws_args:
  tg_deg: 20                # target effective synapses per row, (sum|W|)^2 / sum W^2; rows above it pay
  eps: 1e-12
# --- THE SETTINGS LADDERS OF THE OTHER TASKS (issue #6, since 5 Nov 2026), each OFF here; the maze
# launcher's arms set the lambda. The definitions are the supervised Penalties', mirrored in
# TrainerPPO (its docstrings quote the lines); the supervised config (trainer_ptrack_freshbatch.yaml)
# carries lambda_met and met_args at these values and no rwm block at all (the CDDM arm added
# +trainer.rwm_args={}, the penalty's own defaults, which the block below spells out).
lambda_rwm: 0               # RECURRENT-WEIGHT MAGNITUDE PENALTY on W_rec
                            # (TrainerPPO.rec_weights_magnitude_penalty): every entry above the cap
                            # cap100 x log1p(100) / log1p(N) pays (|W| / cap)^gamma - 1; loss +=
                            # lambda_rwm x P. CDDM's ladder 0.05 and 0.2
rwm_args:                   # the supervised Penalties.rec_weights_magnitude_penalty defaults
  cap100: 0.07              # the cap on |W_ij| at N = 100; it falls as log1p(100) / log1p(N)
  N_ref: 100                # the mean over the N^2 entries is multiplied by N / (N_ref x k_ref)
  k_ref: 20
  gamma: 5.0                # the hinge's power above the cap
  eps: 1e-12
lambda_met: 0               # METABOLIC PENALTY (TrainerPPO.metabolic_penalty): the mean squared
                            # firing rate over every unit, step and episode of the recompute's
                            # states; loss += lambda_met x P. CDDM's ladder 0.01, 0.1, 1, 10
met_args: {}                # the supervised key; the penalty takes no argument
# THE INPUT-WEIGHT CAP is the model's key, model.inp_weight_cap (null in every model config; CDDM's
# arm 0.3): after every optimizer step |W_inp| is clamped to it (TrainerPPO.enforce_inp_cap, the
# supervised Trainer.enforce_inp_cap_).
# NOISY SYNAPSES are the model's key, model.sigma_w (paper value 1.0, 0 in every model config): the
# rollout multiplies W_rec and W_inp by (1 + sigma_w x xi) with a fresh xi at every RNN step, the
# recompute regenerates the same xi from a stored seed (TrainerPPO.synaptic_weights), and the probe
# runs without them, as the supervised clean pass does.
dropout: false              # READ-OUT DROPOUT (TrainerPPO.draw_dropout_mask): one mask per training
                            # rollout, drawn by the supervised rule from a participation EMA over
                            # rollouts, zeroes the dropped units' W_out columns in the rollout AND in
                            # the recompute (the acting policy is the updated policy); the probe
                            # runs without a mask. true switches it on at the values below
dropout_args:               # the supervised block, with drop_rate and dropout_beta at the PAPER's
                            # values (trainer_ptrack_freshbatch.yaml's defaults are 0.05 and 1.0)
  dropout_kind: "mute"      # the only kind mirrored; "dead" is refused at construction
  sampling_method: "participation"
  eta: 0.5                  # the EMA: p_bar <- (1 - eta) x p_bar + eta x p after every rollout
  active_rel: 0.05          # a unit is in the drop pool if p_bar >= this x q95(p_bar)
  drop_rate: 0.2            # expected fraction OF THE POOL dropped per rollout (paper 0.2)
  rescale: true             # a kept unit's column is scaled by 1 / (1 - p_i) (inverted dropout)
  p_max: 0.9                # ceiling on a unit's drop probability; caps the factor at 1 / (1 - p_max)
  dropout_beta: 4.0         # sharpness of the rank softmax within the pool (paper 4)
  activity_q: 0.9           # the quantile in p = std(r) + q(|r|) of the EMA's input
# --- RESCALING (issue #5, stage 2): the supervised prune_and_reinit_ in reinit_mode "rescale" with a
# fixed target, the three-state rule dormant -> growing -> mature (TrainerPPO.prune_and_reinit).
# Once per gradient step (after every optimizer step of ppo_update, n_epochs x n_minibatches per
# update), on the participation of the states recomputed for that minibatch, the noisy rollout
# states of its episodes: a unit silent (p < active_rel x q95(p)) for `patience` checks opens an
# episode, in which its outgoing column is redrawn once, its incoming rows are tilted from inhibition
# toward excitation by rescale_alpha per step and held out of the task gradient, until its soft-max
# rate reaches the target or its cumulative factor reaches rescale_cap. The values below are the
# paper's arm (slurm/SilentReLU_size_series_della.slurm), which the maze launcher passes as swept
# keys as well; where the supervised default (trainer_ptrack_freshbatch.yaml) differs, it is noted.
# What is counted in iterations there is counted in optimizer steps here (check_every, maturity, the
# strikes): 16,000 steps in a 2,000-update run at 4 epochs x 2 minibatches.
# PRUNE-AND-DUPLICATE (issue #6) is the same rule in reinit_mode "copy" (TrainerPPO.duplicate_units):
# a doomed unit is overwritten with a copy of a live unit drawn in proportion to participation, the
# donor's outgoing columns halved and shared with the copy, the copy's incoming rows the donor's
# with a relative jitter of copy_noise on every entry. The maze launcher passes the paper's
# duplication arm (slurm/SilentReLU_paper_grid_della.slurm: check_every 100, patience 3, utility
# contribution, maturity 1000, max_replace_frac 0.025, copy_noise 1.0, copy_norm_preserve true) as
# swept keys; the two copy_* values below are the supervised defaults (trainer_ptrack_freshbatch.yaml).
prune_reinit: false         # true switches the rule on at the values below
prune_args:
  reinit_mode: rescale      # the modes mirrored are "rescale", "copy", "random" and "zero_out"; orth,
                            # mix and bias_kick are refused at construction. "random" redraws a
                            # doomed unit's incoming rows of W_rec and W_inp from N(0, 1/sqrt(N)) and
                            # leaves its outgoing weights as training left them; "zero_out" (Dohare
                            # et al. 2024) redraws the rows and zeroes the outgoing columns of W_rec
                            # and W_out (TrainerPPO.redraw_units). The maze launcher passes the
                            # paper's re-initialisation arms (slurm/SilentReLU_replace_variants_della.slurm
                            # modes random and zero_out: max_replace_frac 0.025, maturity 1000,
                            # utility contribution, and the cadence of trainer_ptrack_freshbatch.yaml,
                            # check_every 100, patience 3) as swept keys
  check_every: 1            # optimizer steps between checks (paper 1 iteration; supervised default 100)
  patience: 1               # consecutive silent checks before a unit is doomed (paper 1; supervised default 3)
  active_rel: 0.05          # silent if participation < this x q95(participation), the project's rule
  utility: participation    # the score that orders candidates when more are doomed than may be
                            # opened: "participation" = p itself; "contribution" = the running mean
                            # of p x sum|outgoing weight| (Dohare et al. 2024), decayed by utility_decay
  utility_decay: 0.99       # running-average rate of the contribution utility (updated every check)
  maturity: 0               # optimizer steps of unconditional protection after a unit is doomed (0 = off)
  max_replace_frac: 1.0     # ceiling on the fraction of units doomed per check, lowest score first
  rescale_alpha: 1.002      # the tilt per optimizer step: positive incoming entries x alpha, negative
                            # / alpha (paper 1.002 per iteration; supervised default 1.0005)
  rescale_target_frac: 10.0 # a growing unit graduates when its soft-max rate (the rate penalty's
                            # statistic, tau from frm_args) reaches this x the rate cap
                            # cap_fr x log1p(100) / log1p(N) (paper 10; supervised default 0.0, the
                            # legacy stop-at-the-floor path, which is refused here)
  rescale_cap: 64.0         # an episode ends unrevived when the cumulative factor reaches this, after
                            # log(64) / log(1.002) = 2,083 steps (paper 64; supervised default 8)
  rescale_protect_frac: 0.20  # ceiling on the fraction of units growing, and so gradient-protected,
                            # at once (paper 0.2)
  rescale_active_only: true # tilt only the W_rec columns of sources that are firing (not silent) at
                            # the check; W_inp is tilted in full (paper true; supervised default false)
  rescale_normalize: true   # scale each tilted row back to the norm it had: the tilt moves weight
                            # from inhibition to excitation at fixed total synaptic weight (paper true)
  rescale_norm_mode: self   # the norm a row is held at: its own ("self", the paper's); "median_active"
                            # is refused
  copy_noise: 0.05          # mode "copy": relative jitter on the copy's incoming rows, each entry x
                            # (1 + copy_noise x N(0, 1)); without it the twins take identical drive and
                            # identical gradients and never separate (paper 1.0)
  copy_norm_preserve: false # mode "copy": scale the jittered rows back to the donor's row norms, so
                            # the jitter sets the copy's direction only, at an expected cosine of
                            # 1 / sqrt(1 + copy_noise^2) to the donor (paper true)
